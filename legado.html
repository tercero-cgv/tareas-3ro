<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expediente del Detective Taíno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --f:'Univers Condensed','Univers LT Std','UniversCondensed','Roboto Condensed','Arial Narrow',sans-serif;
  --w:300; /* Light. Cambie a 400 si necesita letra más gruesa en los iPads */
  --ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--bg:#f6f4ee;--card:#fff;
  --ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--rev:#a16207;--revbg:#fef3c7;
  --c:#b45309;--c2:#fff4e5;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);font-weight:var(--w);color:var(--ink);background:var(--bg);font-size:20px;line-height:1.35}
b,strong,h1,h2,h3,.btn,.tab{font-weight:400}
button,input,select,textarea{font-family:inherit;font-size:inherit;font-weight:var(--w);color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 80px}
header.top{background:var(--c);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px #0002}
header.top .row{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-size:24px;margin:0;flex:1;letter-spacing:.3px}
header.top .who{font-size:17px;opacity:.95}
header.top a{color:#fff;font-size:15px;text-decoration:underline;cursor:pointer}
.banner{background:var(--c2);border-left:8px solid var(--c);border-radius:12px;padding:12px 16px;margin:16px 0 6px}
.banner h2{margin:0;font-size:26px}
.score{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-size:17px;border:1px solid var(--line)}
.pill b{font-weight:700}
.sec{background:var(--card);border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 4px #0001;border:2px solid transparent}
.sec.done{border-color:var(--okbg)}
.sec h4{margin:0 0 6px;font-size:21px;font-weight:400;display:flex;gap:8px;align-items:baseline}
.sec h4 .pts{margin-left:auto;font-size:15px;color:var(--mut);white-space:nowrap}
.part{margin:14px 0}
.q{margin:6px 0 8px}
.lbl{display:block;margin:8px 0 4px}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff}
textarea:focus{outline:none;border-color:var(--c)}
textarea{min-height:90px;resize:vertical}
table.yn{width:100%;border-collapse:collapse}
table.yn td,table.yn th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.yn th{font-size:16px;color:var(--mut);font-weight:400}
.msg{font-size:16px;margin-top:4px;padding:6px 10px;border-radius:8px}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.no{background:var(--badbg);color:var(--bad)}
.msg.rev{background:var(--revbg);color:var(--rev)}
.btn{display:inline-block;border:none;background:var(--ink);color:#fff;border-radius:12px;padding:12px 22px;cursor:pointer;font-size:20px;margin-top:10px}
.btn.sm{font-size:15px;padding:6px 12px;background:#9ca3af}
.btn.go{background:var(--c)}
.btn:disabled{opacity:.4}
.result{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:18px}
.pad{border:2px solid var(--line);border-radius:12px;background:#fff;touch-action:none;width:100%;display:block}
.padbar{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap;align-items:center}
.dot{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.dot.sel{box-shadow:0 0 0 3px var(--ink)}
img.drawn{max-width:100%;border:2px solid var(--line);border-radius:12px}
.locked{text-align:center;padding:50px 10px;color:var(--mut);font-size:22px}
.login{max-width:520px;margin:40px auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 2px 10px #0002;text-align:center}
.login h1{font-size:32px;margin:6px 0}
.demo{background:#fde68a;color:#78350f;text-align:center;font-size:14px;padding:4px}
.toast{pointer-events:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:17px;z-index:20;display:none}
.mapbox{position:relative;max-width:640px;margin:8px auto;background:#e1ebf2;border-radius:12px;overflow:hidden}
.mapbox img{width:100%;display:block}
.zone{position:absolute;border-radius:50%;cursor:pointer;border:3px solid transparent}
.zone.on{border-color:#dc2626;background:#dc262622}
.zone.right{border-color:var(--ok);background:#15803d22}
.zone.wrong{border-color:var(--bad);background:#b91c1c22}
.zone.key{border:3px dashed var(--ok)}
@media(max-width:560px){body{font-size:18px}}
</style>
</head>
<body>
<div id="demo" class="demo" style="display:none">MODO DE PRUEBA: los datos se guardan solo en este navegador.</div>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ===== 1) FIREBASE (mismo proyecto que la Bitácora de Materia) ===== */
const firebaseConfig = {
    apiKey: "AIzaSyB7AMIGXxRUCZxuGghRkkc8-iSSxpMOKsU",
    authDomain: "tareas-organismos.firebaseapp.com",
    projectId: "tareas-organismos",
    storageBucket: "tareas-organismos.firebasestorage.app",
    messagingSenderId: "16309300432",
    appId: "1:16309300432:web:58a9c819470b871997c2d5"
  };
const COL = "legado_taino";
const CFG = ["configuracion","legado_taino"];
const CFG_LISTA = ["configuracion","bitacora_materia"]; // si no hay lista propia, usa la de la Bitácora

const DEMO = firebaseConfig.apiKey.startsWith("PEGA");
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object")deepMerge(a[k],b[k]);else a[k]=b[k];}return a;}
let DB;
if(DEMO){
  const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  DB={
    getCfg:async()=>ls.get("demo_cfg")||{dias:{1:true},roster:["Estudiante de prueba"]},
    watchCfg(cb){const f=async()=>cb(await DB.getCfg());f();window.addEventListener("storage",e=>{if(e.key==="demo_cfg")f()});},
    getDoc:async id=>ls.get("demo_doc_"+id),
    merge:async(id,data)=>{const cur=ls.get("demo_doc_"+id)||{};ls.set("demo_doc_"+id,deepMerge(cur,data));}
  };
}else{
  firebase.initializeApp(firebaseConfig);
  const db=firebase.firestore();
  DB={
    watchCfg(cb){db.collection(CFG[0]).doc(CFG[1]).onSnapshot(async s=>{
      const c=s.exists?s.data():{dias:{},roster:[]};
      if(!(c.roster&&c.roster.length)){try{const o=await db.collection(CFG_LISTA[0]).doc(CFG_LISTA[1]).get();if(o.exists)c.roster=o.data().roster||[];}catch(e){}}
      cb(c);});},
    getDoc:async id=>{const s=await db.collection(COL).doc(id).get();return s.exists?s.data():null;},
    merge:async(id,data)=>db.collection(COL).doc(id).set(data,{merge:true})
  };
}

/* ===== 2) UTILIDADES ===== */
const norm=s=>(" "+String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()+" ");
const words=s=>String(s||"").trim().split(/\s+/).filter(w=>w.length>0).length;
const slug=s=>norm(s).trim().replace(/ /g,"-");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=(s,r=document)=>r.querySelector(s);
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2600);}

      out.f=hit===p.ok.length?(bad?0.5:1):0;out.items.mapa=out.f===1;out.msg=p.msg||"";
      out.vista=[{q:"Mapa: lugares marcados",a:sel.map(z=>(p.zones.find(x=>x[0]===z)||[])[1]).join(", ")||"—",ok:out.f===1}];break;}
    case "grid":{let c=0,t=0;p.rows.forEach(r=>p.cols.forEach(([ck])=>{t++;const v=a?.[r.k]?.[ck];const acc=r.ok[ck];const ok=!!v&&(!acc||acc.includes(v));out.items[r.k+"|"+ck]=ok;if(ok)c++;}));
      out.f=c/t;out.vista=p.rows.map(r=>({q:r.label,a:p.cols.map(([ck])=>(a?.[r.k]?.[ck]||"—")).join(" · "),ok:!!out.items[r.k+"|"+p.cols[0][0]]}));break;}
    case "open":{const t=norm(a);const wc=words(a);let hits=0;(p.kw||[]).forEach(g=>{if(g.some(k=>t.includes(norm(k).trim())))hits++;});
      out.kind="rev";
      if(wc<p.minWords){out.f=0;out.msg=p.hint||"Escribe una respuesta más completa.";out.good=false;}
      else{out.f=p.need===0?1:Math.min(1,(1+hits)/(1+p.need));out.good=p.need===0||hits>0;out.msg=out.good?"":(p.hint||"");}
      out.vista=[{q:p.q,a:a||""}];break;}
    case "draw":{out.f=a?1:0;out.kind="comp";out.vista=[{q:p.label,img:a||""}];break;}
  }
  return out;
}
function gradeSection(sec,ans){
  let num=0,den=0,rev=false;const parts=[];const vista=[];
  sec.parts.forEach((p,i)=>{const g=gradePart(p,ans["p"+i]);parts.push(g);vista.push(...g.vista.map(v=>({...v,kind:g.kind,f:g.f})));
    if(p.w>0){den+=p.w;num+=g.f*p.w;if(g.kind==="rev"||(g.kind==="comp"&&p.type==="draw"))rev=true;}});
  const pts=den?r1(num/den*sec.peso):0;
  return{pts,parts,vista,estado:rev?"revisar":"ok"};
}
function missing(sec,ans){
  const m=[];sec.parts.forEach((p,i)=>{const a=ans["p"+i];
    if(p.type==="mapa"&&(!a||!a.length))m.push("tocar el mapa");
    if(p.type==="grid"&&(!a||p.rows.some(r=>p.cols.some(([ck])=>!a[r.k]?.[ck]))))m.push("la tabla completa");
    if(p.type==="open"&&p.w>0&&!String(a||"").trim())m.push(p.q);
    if(p.type==="draw"&&!a)m.push("tu dibujo");
  });return m;
}

/* ===== 5) ESTADO Y GUARDADO ===== */
let ME=null, CONF={dias:{},roster:[]};
const REC={}, ANS={};
const draftKey=()=>"lt_draft_"+ME.slug;
function saveDraft(){try{localStorage.setItem(draftKey(),JSON.stringify(ANS))}catch(e){}}
function loadDraft(){try{Object.assign(ANS,JSON.parse(localStorage.getItem(draftKey()))||{})}catch(e){}}
const docId=()=>ME.slug+"_d1";
async function loadStudent(){
  loadDraft();
  const doc=await DB.getDoc(docId()).catch(()=>null);
  if(doc&&doc.secciones)for(const id in doc.secciones){REC[id]=doc.secciones[id];if(doc.secciones[id].ans)ANS[id]=doc.secciones[id].ans;}
}
async function persist(sec,g,final){
  const rec={pts:g.pts,max:sec.peso,blk:sec.blk,estado:g.estado,final,intentos:(REC[sec.id]?.intentos||0)+1,ans:ANS[sec.id],vista:g.vista,titulo:sec.title,fecha:new Date().toISOString()};
  REC[sec.id]=rec;
  await DB.merge(docId(),{nombre:ME.nombre,slug:ME.slug,dia:1,actualizado:new Date().toISOString(),secciones:{[sec.id]:rec}});
}

/* ===== 6) PANTALLAS ===== */
function login(){
  const r=CONF.roster||[];
  $("#app").innerHTML=`<div class="login"><div style="font-size:60px">🕵️</div><h1>Expediente del Detective Taíno</h1><p>Tarea de desempeño: Mi herencia taína<br>Tercer grado · Adquisición de la Lengua</p>
  ${r.length?`<select id="who"><option value="">— Escoge tu nombre —</option>${r.map(n=>`<option>${esc(n)}</option>`).join("")}</select>`:`<input id="who" type="text" placeholder="Escribe tu nombre y apellido">`}
  <button class="btn go" id="enter" style="width:100%;margin-top:14px">Entrar 🔎</button></div>`;
  $("#enter").onclick=async()=>{const n=$("#who").value.trim();if(!n)return toast("Escoge tu nombre");
    ME={nombre:n,slug:slug(n)};try{localStorage.setItem("lt_me",JSON.stringify(ME))}catch(e){}
    $("#app").innerHTML='<div class="locked">Cargando tu expediente…</div>';await loadStudent();main();};
}
function totals(){let v=0,p=0;SECS.forEach(s=>{const r=REC[s.id];if(r&&r.final){v+=r.pts;if(r.estado!=="ok")p++;}});return{v:r1(v),p};}
function scoreHTML(){const t=totals();return `<span class="pill">Puntos: <b>${t.v}</b> / ${MAXT}</span>`+(t.p?`<span class="pill">⏳ ${t.p} por revisar del maestro</span>`:"");}
function main(){
  const open=!!CONF.dias?.[1];
  let h=`<header class="top"><div class="row"><h1>🕵️ Expediente del Detective Taíno</h1><span class="who">👤 ${esc(ME.nombre)}</span><a id="out">cambiar</a></div></header><div class="wrap">`;
  if(!open){h+=`<div class="locked">🔒 Tu expediente todavía está cerrado.<br>Tu maestro lo abrirá cuando sea el momento.</div></div>`;$("#app").innerHTML=h;bindTop();return;}
  h+=`<div class="banner"><small>TAREA DE DESEMPEÑO · MI HERENCIA TAÍNA</small><h2>El legado taíno</h2>Como detective, investiga el legado de nuestros primeros pobladores. Contesta y dibuja en cada pregunta; luego toca <b>Verificar</b>.</div><div class="score">${scoreHTML()}</div>`;
  SECS.forEach(s=>{h+=`<div class="sec" id="s_${s.id}"></div>`;});
  h+="</div>";$("#app").innerHTML=h;bindTop();
  SECS.forEach(s=>renderSec(s));
}
function bindTop(){$("#out").onclick=()=>{try{localStorage.removeItem("lt_me")}catch(e){}location.reload();};}
function refreshScore(){const sc=$(".score");if(sc)sc.innerHTML=scoreHTML();}

function renderSec(sec){
  const box=$("#s_"+sec.id);const rec=REC[sec.id];const final=rec&&rec.final;
  const ans=ANS[sec.id]=ANS[sec.id]||{};
  const g=rec?gradeSection(sec,ans):null;
  box.className="sec"+(final?" done":"");
  let h=`<h4>${sec.title}<span class="pts">${final?`<b>${rec.pts}</b> / ${sec.peso} pts`:`${sec.peso} pts`}</span></h4>${sec.intro?`<div class="q">${sec.intro}</div>`:""}`;
  sec.parts.forEach((p,i)=>{h+=`<div class="part" id="p_${sec.id}_${i}"></div>`;});
  if(!final)h+=`<button class="btn go" id="v_${sec.id}">✔ Verificar</button>`;
  h+=`<div id="r_${sec.id}"></div>`;
  box.innerHTML=h;
  sec.parts.forEach((p,i)=>renderPart(sec,p,i,$(`#p_${sec.id}_${i}`),final,rec?g.parts[i]:null));
  if(final)showResult(sec,rec);
  else if(rec){$(`#r_${sec.id}`).innerHTML=`<div class="result msg rev">💡 Puedes mejorar tu respuesta una vez más antes de enviarla. Lee la pista.</div>`;}
  const vb=$("#v_"+sec.id);if(vb)vb.onclick=()=>verify(sec);
}
function showResult(sec,rec){
  const el=$(`#r_${sec.id}`);let cls="ok",txt;
  if(rec.pts>=sec.peso*0.99)txt=`🌟 ¡Excelente, detective! ${rec.pts} / ${sec.peso}`;
  else{txt=`✔ Pregunta completada: ${rec.pts} / ${sec.peso}.`;cls="rev";}
  if(rec.estado==="revisar")txt+=" · ✍️ Tu maestro revisará tu escrito y tu dibujo y puede ajustar los puntos.";
  el.innerHTML=`<div class="result msg ${cls}">${txt}</div>`;
}
async function verify(sec){
  const ans=ANS[sec.id]||{};const m=missing(sec,ans);
  if(m.length){toast("Te falta: "+m[0]);return;}
  const g=gradeSection(sec,ans);
  const retryable=sec.parts.every(p=>["open","draw"].includes(p.type));
  const weak=g.parts.some((x,i)=>sec.parts[i].type==="open"&&sec.parts[i].w>0&&!x.good);
  const first=!REC[sec.id];
  const final=!(retryable&&weak&&first);
  const btn=$("#v_"+sec.id);btn.disabled=true;btn.textContent="Guardando…";
  try{await persist(sec,g,final);saveDraft();}
  catch(e){console.error(e);btn.disabled=false;btn.textContent="✔ Verificar";return toast("No se pudo guardar. Revisa el internet y vuelve a intentar.");}
  renderSec(sec);refreshScore();
  if(!final)toast("💡 Lee la pista y mejora tu respuesta");
}

function renderPart(sec,p,i,el,ro,g){
  const A=ANS[sec.id];const key="p"+i;const set=v=>{A[key]=v;saveDraft();};
  switch(p.type){
  case "mapa":{const v=A[key]||[];
    el.innerHTML=`<div class="mapbox"><img src="${MAPIMG}" alt="Mapa del Caribe">${p.zones.map(([k,l,x,y,w,h])=>{let c=v.includes(k)?"on":"";if(ro){c=v.includes(k)?(p.ok.includes(k)?"right":"wrong"):(!v.some(z=>p.ok.includes(z))&&p.ok.includes(k)?"key":"");}
      return `<div class="zone ${c}" data-k="${k}" title="${l}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></div>`}).join("")}</div>`+
      (ro&&g?`<div class="msg ${g.items.mapa?"ok":"no"}">${g.items.mapa?"✔ ":"✘ "}${p.msg}</div>`:"");
    if(!ro)el.querySelectorAll(".zone").forEach(z=>z.onclick=()=>{const a=(A[key]||[]).slice();const k=z.dataset.k;const ix=a.indexOf(k);if(ix>=0)a.splice(ix,1);else a.push(k);set(a);renderPart(sec,p,i,el,ro,g);});break;}
  case "grid":{const v=A[key]||{};
    el.innerHTML=`<div class="q">${p.q}</div><div style="overflow-x:auto"><table class="yn"><tr><th>Clase social</th>${p.cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr>${p.rows.map(r=>`<tr><td>${r.label}</td>${p.cols.map(([ck,cl,opts])=>`<td><select data-r="${r.k}" data-c="${ck}" ${ro?"disabled":""} style="${ro&&g?(g.items[r.k+"|"+ck]?"border-color:var(--ok);background:var(--okbg)":"border-color:var(--bad);background:var(--badbg)"):""}"><option value="">—</option>${opts.map(o=>`<option ${v[r.k]?.[ck]===o?"selected":""}>${o}</option>`).join("")}</select></td>`).join("")}</tr>`).join("")}</table></div>`;
    if(!ro)el.querySelectorAll("select").forEach(s=>s.onchange=()=>{const a=A[key]||{};a[s.dataset.r]=a[s.dataset.r]||{};a[s.dataset.r][s.dataset.c]=s.value;set(a);});break;}
  case "open":{const v=A[key]||"";
    el.innerHTML=`<label class="lbl">${p.q}</label><textarea ${ro?"disabled":""} placeholder="Escribe aquí en oraciones completas…">${esc(v)}</textarea>`+
      (g&&p.w>0?(g.good?(ro?`<div class="msg ok">✔ ¡Buena respuesta! Tu maestro la leerá.</div>`:""):`<div class="msg rev">💡 Pista: ${g.msg}</div>`):"");
    if(!ro)el.querySelector("textarea").oninput=e=>set(e.target.value);break;}
  case "draw":{const v=A[key];
    if(ro){el.innerHTML=`<div class="lbl">${p.label}</div>`+(v?`<img class="drawn" src="${v}">`:`<div class="msg no">Sin dibujo</div>`);break;}
    el.innerHTML=`<div class="lbl">🎨 ${p.label}</div><div class="padbar"></div><canvas class="pad"></canvas>`;
    makePad(el,v,d=>set(d));break;}
  }
}

function makePad(el,initial,onSave){
  const cv=el.querySelector("canvas"),bar=el.querySelector(".padbar");
  const W=600,H=360;cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.lineCap="round";ctx.lineJoin="round";
  if(initial){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,W,H);im.src=initial;}
  let color="#111827",size=5;
  const cols=["#111827","#dc2626","#2563eb","#16a34a","#f59e0b","#7c3aed","#8b5a2b","#ffffff"];
  bar.innerHTML=cols.map(c=>`<span class="dot ${c===color?"sel":""}" data-c="${c}" style="background:${c}" title="${c==="#ffffff"?"borrador":""}"></span>`).join("")+`<button class="btn sm" data-clear>🗑️ Borrar todo</button>`;
  bar.querySelectorAll(".dot").forEach(d=>d.onclick=()=>{color=d.dataset.c;size=color==="#ffffff"?22:5;bar.querySelectorAll(".dot").forEach(x=>x.classList.toggle("sel",x===d));});
  bar.querySelector("[data-clear]").onclick=()=>{ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);onSave("");};
  let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
  cv.addEventListener("pointerdown",e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.fillStyle=color;ctx.arc(last[0],last[1],size/2,0,7);ctx.fill();});
  cv.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=size;ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;});
  const end=()=>{if(!drawing)return;drawing=false;
    const s=document.createElement("canvas");s.width=420;s.height=252;s.getContext("2d").drawImage(cv,0,0,420,252);onSave(s.toDataURL("image/jpeg",0.6));};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);cv.addEventListener("pointerleave",end);
}

/* ===== 7) INICIO ===== */
(async function(){
  if(DEMO)$("#demo").style.display="block";
  let first=true;
  DB.watchCfg(async c=>{
    CONF=c||{dias:{},roster:[]};
    if(first){first=false;
      let saved=null;try{saved=JSON.parse(localStorage.getItem("lt_me"))}catch(e){}
      if(saved&&saved.slug){ME=saved;$("#app").innerHTML='<div class="locked">Cargando tu expediente…</div>';await loadStudent();main();}
      else login();
    }else if(ME){main();toast("El maestro actualizó el acceso");}
  });
})();
</script>
